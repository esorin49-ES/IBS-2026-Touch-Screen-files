<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Touch Screen IBS 2026</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f6f9; }
    header { background-color: #003366; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 1000; }
    h1 { margin: 0; font-size: 20px; }
    .btn-home { background-color: #007bff; color: white; border: none; padding: 10px 18px; border-radius: 5px; font-weight: bold; text-decoration: none; cursor: pointer; }
    .container { padding: 30px; max-width: 1000px; margin: auto; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px; }
    .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; }
    .btn-pdf { display: inline-block; margin-top: 15px; padding: 12px 20px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
  </style>
</head>
<body>

  <header>
    <h1>Touch Screen IBS 2026</h1>
    <!-- Bouton Accueil toujours visible -->
    <a href="index.html" class="btn-home" target="_self">Accueil</a>
  </header>

  <div class="container">
    <h2>Solutions Tactiles & Logiciels</h2>
    <div class="grid">
      
      <!-- Fiche Produit 1 -->
      <div class="card">
        <h3>OptiPoint™ System Touch</h3>
        <p>Écran tactile capacitif couleur pour la gestion des automates BACnet.</p>
        <!-- target="_self" force l'ouverture dans la MÊME fenêtre -->
        <a href="SYST_TOUCH.pdf" class="btn-pdf" target="_self">Voir la fiche PDF</a>
      </div>

      <!-- Fiche Produit 2 -->
      <div class="card">
        <h3>Equipment Touch EQT3</h3>
        <p>Écrans 7", 10.1" et 15.6" pour la supervision des équipements HVAC.</p>
        <a href="EQT3.pdf" class="btn-pdf" target="_self">Voir la fiche PDF</a>
      </div>

    </div>
  </div>

  <!-- Script de retour automatique à l'accueil après 2 minutes d'inactivité -->
  <script>
    let timeout;
    function resetTimer() {
      clearTimeout(timeout);
      // 120000 ms = 2 minutes d'inactivité
      timeout = setTimeout(() => {
        window.location.href = "index.html";
      }, 120000);
    }
    window.onload = resetTimer;
    document.onmousemove = resetTimer;
    document.onkeypress = resetTimer;
    document.ontouchstart = resetTimer;
  </script>

</body>
</html>
